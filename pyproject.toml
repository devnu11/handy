[project]
name = "handy"
version = "0.1.0"
description = "A collection of small Python tools that do handy things."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
handy = "handy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
